name: TikTok Bot

on:
  workflow_dispatch:        # manual start button
  schedule:
    - cron: "0 * * * *"     # a new session every hour

permissions:
  contents: write          # lets the job save the small stats file for the dashboard

concurrency:
  group: tiktok-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TZ: "Asia/Baghdad"
      PROFILE_CAP: "1000"    # per day
      LIKE_CAP: "100"
      COMMENT_CAP: "50"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore daily counters
        uses: actions/cache/restore@v4
        with:
          path: stats.json
          key: stats-${{ github.run_id }}
          restore-keys: stats-

      - name: Run bot
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          SOURCE: "feed"          # hashtag pages show a puzzle to GitHub servers, so use the For You feed
          KURDISH_ONLY: "0"       # the GitHub server feed is not Kurdish, so visit everyone
          RUN_MINUTES: "55"
          SESSION_CAP: "120"
          START_JITTER_MIN: "5"
          ACTIVE_HOURS: "10-23"
          SPEED: "1.5"
          LIKE_CHANCE: "0.08"
          COMMENT_CHANCE: "0.04"
          COMMENT_STYLE: "hearts"
        run: python bot.py

      - name: Save daily counters
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stats.json
          key: stats-${{ github.run_id }}

      - name: Publish counters for the dashboard
        if: always()
        continue-on-error: true
        run: |
          python publish_stats.py
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats-public.json
          git diff --cached --quiet || (git commit -q -m "stats" && git pull --rebase -q && git push -q)

      - name: Save debug files if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
