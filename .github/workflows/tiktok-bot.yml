name: TikTok Bot

on:
  workflow_dispatch:        # manual start button
  schedule:
    - cron: "0 */2 * * *"   # a new short session every 2 hours

concurrency:
  group: tiktok-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore daily counters
        uses: actions/cache/restore@v4
        with:
          path: stats.json
          key: stats-${{ github.run_id }}
          restore-keys: stats-

      - name: Run bot
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          TZ: "Asia/Baghdad"
          SOURCE: "tags"
          RUN_MINUTES: "110"
          SESSION_CAP: "70"
          START_JITTER_MIN: "15"
          ACTIVE_HOURS: "10-23"
          SPEED: "1.5"
        run: python bot.py

      - name: Save daily counters
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stats.json
          key: stats-${{ github.run_id }}

      - name: Save debug files if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
